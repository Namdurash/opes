schema: spec-driven

# Project context — shown to the AI when creating every artifact (proposal/specs/design/tasks).
# These are constraints that guide what gets written; they are NOT copied into the artifacts.
context: |
  Product: Offline-first personal finance manager (MVP). Local-only — no backend, no auth.
  Monobank is an optional sync source, never a dependency of core flows.

  Tech stack: React Native CLI + TypeScript (strict). Zustand (state), WatermelonDB
  (local source of truth), react-hook-form + Yup (forms/validation), @anthropic-ai/sdk (agents).

  Enforced layer architecture — data flows one direction:
    UI (features/) -> Zustand store actions -> repositories (models/) -> WatermelonDB
                                   \-> services/ (sync, categorization, monobank) ->
  - Components call store actions only — never repositories, services, or the DB directly.
  - Repositories (src/models/<entity>/) are the ONLY code that reads/writes the DB; they
    return domain/ types (never WatermelonDB models) and are async.
  - domain/ is pure TypeScript types — no React/RN/storage imports.
  - Every folder exposes a barrel index.ts; shared helpers live in src/shared/.

  Code style: arrow functions only (no `function`), const/let only, async/await,
  destructuring, `??`/`?.`, no `any`, `import type` for types, explicit return types on
  exports. Keep changes small, additive, and scoped — prefer reuse over new abstractions;
  no new dependency without justification.

  Process: one branch per ticket, cut from `main` when work starts, named
  `<domain>/opes-<ticket-number>-<short-name>` where domain is feat|fix|chore|docs.
  All of a ticket's commits land on that branch; never merge or push — the maintainer lands it.
  Every non-trivial change runs the full OpenSpec loop (propose -> apply -> archive) and
  is committed per phase as `<type>(OPES-XX): <subject>` (Conventional Commits + a `Ticket:`
  line in proposal.md is the scope source of truth).

  Definition of Done for any change: `npx tsc --noEmit` (strict) passes, `npm run lint`
  passes, `npm test` passes, no unused imports/exports, layer `CLAUDE.md` updated if a rule
  it documents changed.

# Per-artifact rules — extra constraints applied per artifact type. Do NOT copy into output.
rules:
  proposal:
    - "Start the file with a `Ticket: OPES-XX` line (the commit scope source of truth). If the user has not given a ticket number, use `Ticket: OPES-TBD` and flag that it must be filled before committing."
    - Keep it tight and scoped to one coherent change; prefer additive work over refactors.
    - Add a `## Non-goals` section that explicitly lists what is intentionally out of scope.
    - In `## Impact`, name the affected layers (features/models/services/domain/shared) and any data model or migration impact.
  design:
    - Respect the enforced one-directional layer architecture (UI -> store -> repository -> DB; services on the side). Never propose a component touching repositories/services/DB directly.
    - Reuse existing patterns — store factory like src/features/transactions/state/useTransactionsStore.ts, the repository contract + class + toDomain mapper pattern in src/models/, Yup schemas in src/shared/validation/.
    - Justify any new dependency (what problem it solves, why a built-in/existing pattern won't do). Default to no new dependency.
    - Call out WatermelonDB schema-version bumps + migrations when the data model changes.
  tasks:
    - Order tasks so each is small, independently verifiable, and leaves the build green.
    - The final task group must satisfy the Definition of Done (tsc --noEmit, lint, test) before the change is apply-complete.
    - Group tasks by layer when a change spans several (domain -> models -> services -> features).
  specs:
    - "One delta spec per capability at specs/<capability>/spec.md, capability name in kebab-case."
    - "Use the delta headers `## ADDED|MODIFIED|REMOVED|RENAMED Requirements`, then `### Requirement: <name>` with SHALL/MUST wording, then `#### Scenario:` blocks of `- **WHEN**` / `- **THEN**` bullets."
    - "Deltas express intent — for MODIFIED, include only the requirement and scenarios that change, not a full copy."
